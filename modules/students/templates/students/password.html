{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head">
  <div><a class="small" href="{{ url_for('students.me') }}">← My profile</a>
    <h1 style="margin-top:6px">Change password</h1></div>
</div>
<div class="card form-card">
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label class="lbl" for="current">Current password</label>
      <input type="password" id="current" name="current" required></div>
    <div class="field"><label class="lbl" for="new">New password</label>
      <input type="password" id="new" name="new" minlength="8" required>
      <p class="hint">At least 8 characters.</p></div>
    <div class="field"><label class="lbl" for="confirm">Repeat new password</label>
      <input type="password" id="confirm" name="confirm" required></div>
    <div class="form-actions">
      <button class="btn" type="submit">Change password</button>
      <a class="btn secondary" href="{{ url_for('students.me') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
